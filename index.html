<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darshit Dave - Portfolio</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <style>
        /* General Reset and Basic Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            line-height: 1.6;
            background-color: #f4f7fa;
            color: #333;
        }

        h1, h2, p {
            margin-bottom: 1em;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* Container for the content */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header Section */
        header {
            background-color: #212121;
            color: white;
            text-align: center;
            padding: 50px 0;
            margin-bottom: 50px;
            position: relative;
        }

        header .name {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        header .role {
            font-size: 1.3em;
            color: #a1c4fd;
            margin-bottom: 20px;
        }

        header .social-links a {
            color: white;
            font-size: 1.5em;
            margin: 0 15px;
            transition: color 0.3s;
        }

        header .social-links a:hover {
            color: #a1c4fd;
        }

        /* About Me Section */
        .about-me {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 50px;
        }

        .about-me img {
            border-radius: 50%;
            width: 200px;
            height: 200px;
            margin-right: 30px;
        }

        .about-me .info {
            flex: 1;
        }

        .about-me .info h2 {
            font-size: 2em;
            color: #333;
        }

        .about-me .info p {
            font-size: 1.1em;
            color: #555;
            margin-bottom: 20px;
        }

        /* Skills Section */
        .skills {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 50px;
        }

        .skills .skill {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: transform 0.3s;
        }

        .skills .skill:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .skills .skill h3 {
            font-size: 1.5em;
            margin-bottom: 15px;
        }

        /* Footer Section */
        footer {
            background-color: #212121;
            color: white;
            text-align: center;
            padding: 20px;
        }

        /* Mobile Responsiveness */
        @media screen and (max-width: 768px) {
            .about-me {
                flex-direction: column;
                align-items: center;
            }

            .skills {
                grid-template-columns: 1fr 1fr;
            }
        }

    </style>
</head>
<body ng-app="portfolioApp" ng-controller="portfolioCtrl">
    <header>
        <div class="container">
            <h1 class="name">{{ name }}</h1>
            <p class="role">{{ role }}</p>
            <div class="social-links">
                <a href="{{ socialLinks.github }}" target="_blank">GitHub</a>
                <a href="{{ socialLinks.linkedin }}" target="_blank">LinkedIn</a>
                <a href="{{ socialLinks.twitter }}" target="_blank">Twitter</a>
            </div>
        </div>
    </header>

    <div class="container">
        <!-- About Me Section -->
        <section class="about-me">
            <img src="{{ profilePicture }}" alt="Profile Picture">
            <div class="info">
                <h2>About Me</h2>
                <p>{{ bio }}</p>
                <p><strong>Email:</strong> <a href="mailto:{{ email }}">{{ email }}</a></p>
            </div>
        </section>

        <!-- Skills Section -->
        <section class="skills">
            <div class="skill" ng-repeat="skill in skills">
                <h3>{{ skill.name }}</h3>
                <p>{{ skill.description }}</p>
            </div>
        </section>
    </div>

    <footer>
        <p>Created with ❤️ by {{ name }} using AngularJS</p>
    </footer>

    <script>
        var app = angular.module('portfolioApp', []);

        app.controller('portfolioCtrl', function($scope) {
            // Basic personal info
            $scope.name = "Darshit Dave";
            $scope.role = "Intermidiate Full Stack Developer";
            $scope.profilePicture = "profile.jpg";  // Replace with your actual profile picture
            $scope.bio = "I'm a passionate web developer with expertise in front-end and back-end technologies. I love building responsive and interactive websites and web apps.";
            $scope.email = "davedarshit1@gmail.com";
            
            // Social Links
            $scope.socialLinks = {
                github: "https://github.com/darshitdave",
                linkedin: "https://ca.linkedin.com/in/darshit-dave",
            };

            // Skills
            $scope.skills = [
                { name: "HTML", description: "Markup language for creating web pages." },
                { name: "CSS", description: "Style sheet language for describing the presentation of a document." },
                { name: "JavaScript", description: "Programming language that enables interactivity in web pages." },
                { name: "Angular", description: "A front-end framework for building dynamic web apps." },
                { name: "Node.js", description: "JavaScript runtime for server-side development." },
                { name: "MongoDB", description: "A NoSQL database that stores data in flexible, JSON-like formats." }
            };
        });
    </script>
</body>
</html>
