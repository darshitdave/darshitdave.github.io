<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Darshit Dave - Full Stack Developer</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet"/>
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <!-- Global Styles -->
  <link rel="stylesheet" href="styles.css"/>
  <!-- Component Styles -->
  <link rel="stylesheet" href="components/NavBar.css"/>
  <link rel="stylesheet" href="components/IntroSection.css"/>
  <link rel="stylesheet" href="components/AboutSection.css"/>
  <link rel="stylesheet" href="components/SkillsSection.css"/>
  <link rel="stylesheet" href="components/ProjectsSection.css"/>
  <link rel="stylesheet" href="components/ContactSection.css"/>
  <link rel="stylesheet" href="components/AppFooter.css"/>
</head>
<body>
<div id="app">
  <nav-bar></nav-bar>
  <intro-section></intro-section>
  <about-section :project-count="projects.length"></about-section>
  <skills-section :skills="skills"></skills-section>
  <projects-section :projects="projects"></projects-section>
  <contact-section></contact-section>
  <app-footer></app-footer>
</div>

<script type="importmap">
{
  "imports": {
    "vue": "https://cdnjs.cloudflare.com/ajax/libs/vue/3.3.4/vue.esm-browser.prod.min.js"
  }
}
</script>

<script type="module">
import { createApp } from 'vue';
import NavBar         from './components/NavBar.js';
import IntroSection    from './components/IntroSection.js';
import AboutSection   from './components/AboutSection.js';
import SkillsSection  from './components/SkillsSection.js';
import ProjectsSection from './components/ProjectsSection.js';
import ContactSection from './components/ContactSection.js';
import AppFooter      from './components/AppFooter.js';

const app = createApp({
  data() {
    return {
      skills: [
        {
          name: 'Frontend',
          icon: 'fa-solid fa-desktop',
          items: ['HTML5', 'CSS3', 'JavaScript', 'Vue.js', 'Bootstrap', 'jQuery']
        },
        {
          name: 'Backend',
          icon: 'fa-solid fa-server',
          items: ['PHP', 'Laravel', 'Python', 'LangChain', 'REST APIs']
        },
        {
          name: 'Database',
          icon: 'fa-solid fa-database',
          items: ['MySQL', 'PostgreSQL', 'Database Design', 'Migrations']
        },
        {
          name: 'Tools',
          icon: 'fa-solid fa-wrench',
          items: ['Git', 'GitHub', 'Linux', 'VS Code', 'npm', 'Composer']
        }
      ],
      projects: [
        {
          name: 'News Research Tool',
          icon: 'fa-solid fa-newspaper',
          desc: 'The News Research Tool allows users to analyze news articles by providing URLs and asking questions to extract meaningful insights.',
          tech: ['Python', 'LangChain', 'OpenAI', 'FAISS', 'Streamlit'],
          url: 'https://github.com/darshitdave/news-research-tool'
        },
        {
          name: 'Pharma Sales Webapp',
          icon: 'fa-solid fa-pills',
          desc: 'A web-based Pharma Sales Management System built to manage medicine sales, customers, invoices, and reports for pharmaceutical businesses.',
          tech: ['PHP', 'Laravel', 'MySQL', 'Bootstrap', 'jQuery'],
          url: 'https://github.com/darshitdave/pharma-sales-webapp'
        }
      ]
    };
  }
});

// Register all components globally
app.component('NavBar',          NavBar);
app.component('IntroSection',     IntroSection);
app.component('AboutSection',    AboutSection);
app.component('SkillsSection',   SkillsSection);
app.component('ProjectsSection', ProjectsSection);
app.component('ContactSection',  ContactSection);
app.component('AppFooter',       AppFooter);

app.mount('#app');
</script>
</body>
</html>
